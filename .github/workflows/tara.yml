name: Tara Pump
on: workflow_dispatch
jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python tara_pump.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pumps
          path: pumps.csv
