name: vp-pro-bot

on:
  schedule:
    - cron: "0 * * * *"   # her saat başı (önceki çalışma bitene kadar sırada bekler)
  workflow_dispatch:

concurrency:
  group: vp-pro-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Botu çalıştır (dakikada 1 tarar)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_RUNTIME_MIN: "330"
        run: python vp_pro_bot.py
