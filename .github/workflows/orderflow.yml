name: Orderflow Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"   # zincir koparsa yedek baslatici

concurrency:
  group: orderflow-bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      RUN_MINUTES: "340"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketleri kur
        run: pip install aiohttp websockets

      - name: Baslangic zamani
        run: echo "START_TS=$(date +%s)" >> "$GITHUB_ENV"

      - name: Onceki durumu yukle
        uses: actions/cache/restore@v4
        with:
          path: state
          key: orderflow-state-none
          restore-keys: |
            orderflow-state-

      - name: Dosyayi dogrula
        run: |
          wc -l bitget_orderflow_bot.py
          tail -n 8 bitget_orderflow_bot.py
          python -m py_compile bitget_orderflow_bot.py
          if ! grep -q "asyncio.run(main())" bitget_orderflow_bot.py || ! grep -q "HTTP.close()" bitget_orderflow_bot.py; then
            echo "HATA: bitget_orderflow_bot.py kesik, dosyanin sonu eksik."
            exit 1
          fi

      - name: Botu calistir
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          RUN_MINUTES: ${{ env.RUN_MINUTES }}
        run: python -u bitget_orderflow_bot.py

      - name: Durumu kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: orderflow-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Sonraki turu baslat
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ELAPSED=$(( $(date +%s) - START_TS ))
          MIN_OK=$(( RUN_MINUTES * 60 - 300 ))
          if [ "$ELAPSED" -lt "$MIN_OK" ]; then
            echo "Bot erken durdu (${ELAPSED} sn), zincir baslatilmadi."
            exit 1
          fi
          gh workflow run "${{ github.workflow }}" --ref "${{ github.ref_name }}" -R "${{ github.repository }}"
